# Historical OpenMemory evaluation configuration; NOT a Remember Me deployment.
# These third-party images are not built or distributed by this project.
# Start Remember Me with bin/start.sh; see README.md.
services:
  openmemory:
    image: mem0/openmemory-mcp
    ports:
      - "8080:8080"
    environment:
      - OPENAI_API_KEY=your_key   # 如果你不用本地 embedding 可以先随便填

  ui:
    image: mem0/openmemory-ui
    ports:
      - "3000:3000"
    environment:
      - OPENMEMORY_API_URL=http://openmemory:8080
    depends_on:
      - openmemory
