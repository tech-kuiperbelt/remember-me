x-runtime: &runtime
  image: "${REMEMBER_ME_IMAGE:-ghcr.io/tech-kuiperbelt/remember-me:latest}"
  platform: linux/amd64
  pull_policy: missing

x-data: &data
  type: bind
  source: "${REMEMBER_ME_DATA_DIR:-.}"
  target: /data
  bind:
    create_host_path: true

services:
  remember-me:
    <<: *runtime
    restart: unless-stopped
    stop_grace_period: 120s
    environment:
      MEMORY_DATA_DIR: /data
      MEMORY_STORAGE: dual
    command: [--host, 0.0.0.0, --port, "1314"]
    ports:
      - "127.0.0.1:${REMEMBER_ME_PORT:-1314}:1314"
    volumes:
      - *data
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
    healthcheck:
      test: [CMD, python, /opt/remember-me/docker/healthcheck.py]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3
