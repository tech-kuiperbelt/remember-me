<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f5;color:#333;min-height:100vh}
.header{background:#4a90d9;color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:20px;font-weight:600}
.header .sub{font-size:13px;opacity:.85}
.nav{background:#fff;border-bottom:1px solid #e0e0e0;display:flex;padding:0 24px;position:sticky;top:0;z-index:10}
.nav a{padding:12px 18px;text-decoration:none;color:#555;font-size:14px;border-bottom:2px solid transparent;transition:.15s;cursor:pointer}
.nav a:hover{color:#4a90d9}
.nav a.active{color:#4a90d9;border-bottom-color:#4a90d9}
.content{padding:24px;max-width:1200px;margin:0 auto}
.page{display:none}
.page.active{display:block}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:16px;overflow:hidden}
.card-header{padding:14px 18px;border-bottom:1px solid #f0f0f0;font-weight:600;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.card-body{padding:18px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #f0f0f0}
th{background:#fafafa;font-weight:600;color:#555;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
tr:hover{background:#f8fbff}
tr.selected{background:#e8f4fd}
.memory-text{max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;background:#e8f0fe;color:#4a90d9}
.badge.ns{background:#e8f5e9;color:#388e3c}
.btn{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border:none;border-radius:6px;font-size:13px;cursor:pointer;transition:.15s;text-decoration:none}
.btn-primary{background:#4a90d9;color:#fff}
.btn-primary:hover{background:#3a7bc8}
.btn-danger{background:#e53935;color:#fff}
.btn-danger:hover{background:#c62828}
.btn-outline{background:transparent;border:1px solid #ddd;color:#555}
.btn-outline:hover{background:#f5f5f5}
.btn-sm{padding:4px 10px;font-size:12px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:#555}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;outline:0;transition:.15s}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:#4a90d9;box-shadow:0 0 0 3px rgba(74,144,217,.15)}
.form-group textarea{min-height:80px;resize:vertical;font-family:inherit}
.form-row{display:flex;gap:12px}
.form-row .form-group{flex:1}
.pagination{display:flex;align-items:center;gap:8px;padding:12px 0;font-size:13px;justify-content:center}
.pagination button{min-width:32px}
.empty-state{text-align:center;padding:40px;color:#999;font-size:14px}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:8px;color:#fff;font-size:13px;z-index:999;animation:slideUp .3s;max-width:400px}
.toast.success{background:#43a047}
.toast.error{background:#e53935}
.toast.info{background:#4a90d9}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.loading{text-align:center;padding:30px;color:#999}
.detail-field{margin-bottom:12px}
.detail-field .label{font-size:12px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.detail-field .value{font-size:14px;word-break:break-all}
.metadata-view{background:#f8f9fa;padding:10px;border-radius:6px;font-family:monospace;font-size:12px;white-space:pre-wrap;max-height:200px;overflow:auto}
pre.json{background:#f8f9fa;padding:12px;border-radius:6px;font-size:12px;overflow:auto;max-height:300px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.search-highlight{background:#fff3cd;padding:0 2px}
@media(max-width:768px){.form-row{flex-direction:column}.content{padding:12px}.nav{overflow-x:auto}.nav a{white-space:nowrap}}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>Memory Admin</h1>
    <div class="sub" id="server-info">remember-me MCP Server</div>
  </div>
  <button class="btn btn-outline" style="color:#fff;border-color:rgba(255,255,255,.4)" onclick="refreshStats()">Refresh</button>
</div>

<div class="nav" id="nav">
  <a class="active" onclick="switchPage('memories')">Memories</a>
  <a onclick="switchPage('search')">Search</a>
  <a onclick="switchPage('add')">Add Memory</a>
  <a onclick="switchPage('stats')">Stats</a>
</div>

<div class="content">

<!-- Memories -->
<div class="page active" id="page-memories">
  <div class="card">
    <div class="card-header">
      <span>All Memories</span>
      <div style="display:flex;gap:8px;align-items:center">
        <select id="ns-filter" style="font-size:12px;padding:4px 8px;border:1px solid #ddd;border-radius:4px" onchange="loadMemories()">
          <option value="">All Namespaces</option>
        </select>
        <button class="btn btn-danger btn-sm" onclick="clearNamespace()">Clear</button>
      </div>
    </div>
    <div class="card-body" style="padding:0">
      <div id="memories-list"><div class="loading">Loading...</div></div>
      <div class="pagination" id="memories-pagination"></div>
    </div>
  </div>
</div>

<!-- Search -->
<div class="page" id="page-search">
  <div class="card">
    <div class="card-header">Semantic Search</div>
    <div class="card-body">
      <form onsubmit="doSearch(event)">
        <div class="form-group">
          <label>Query</label>
          <input id="search-query" placeholder="Enter search text..." required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Max results (k)</label>
            <input id="search-k" type="number" value="10" min="1" max="100">
          </div>
          <div class="form-group">
            <label>Threshold</label>
            <input id="search-threshold" type="number" value="0" min="0" max="1" step="0.05">
          </div>
          <div class="form-group">
            <label>Namespace</label>
            <input id="search-ns" placeholder="(all)">
          </div>
        </div>
        <button class="btn btn-primary" type="submit">Search</button>
      </form>
      <div id="search-results" style="margin-top:16px"></div>
    </div>
  </div>
</div>

<!-- Add -->
<div class="page" id="page-add">
  <div class="card">
    <div class="card-header">Add New Memory</div>
    <div class="card-body">
      <form onsubmit="doAdd(event)">
        <div class="form-group">
          <label>Text *</label>
          <textarea id="add-text" required></textarea>
        </div>
        <div class="form-group">
          <label>Metadata (JSON)</label>
          <textarea id="add-metadata" placeholder='e.g. {"source": "chat", "tags": ["important"]}'></textarea>
        </div>
        <div class="form-group">
          <label>Namespace</label>
          <input id="add-ns" value="default">
        </div>
        <button class="btn btn-primary" type="submit">Add Memory</button>
      </form>
    </div>
  </div>
</div>

<!-- Stats -->
<div class="page" id="page-stats">
  <div class="card">
    <div class="card-header">Storage Statistics</div>
    <div class="card-body" id="stats-content"><div class="loading">Loading...</div></div>
  </div>
</div>

<!-- Detail modal -->
<div id="detail-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center" onclick="closeDetail(event)">
  <div style="background:#fff;border-radius:12px;width:700px;max-width:95vw;max-height:90vh;overflow:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)" onclick="event.stopPropagation()">
    <div style="padding:18px 20px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center">
      <strong id="detail-title" style="font-size:16px">Memory Detail</strong>
      <button class="btn btn-sm btn-outline" onclick="closeDetail()">✕</button>
    </div>
    <div style="padding:20px" id="detail-body"></div>
  </div>
</div>

</div>

<script>
// State
let memoriesOffset = 0;
const MEMORIES_LIMIT = 20;
let currentMemories = [];
let allNamespaces = [];

// Helpers
function $(id) { return document.getElementById(id) }

function formatTime(isoStr) {
  if (!isoStr) return '';
  const d = new Date(isoStr);
  if (isNaN(d.getTime())) return isoStr;
  return d.toLocaleString();
}

function toast(msg, type='success') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function api(path, opts={}) {
  return fetch('/api' + path, {
    headers: {'Content-Type': 'application/json', ...opts.headers},
    ...opts,
  }).then(r => {
    if (!r.ok) return r.json().then(e => { throw new Error(e.detail || r.statusText) });
    return r.json();
  });
}

// Navigation
function switchPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav a').forEach(a => a.classList.remove('active'));
  $('page-' + name).classList.add('active');
  document.querySelector(`.nav a[onclick*="${name}"]`).classList.add('active');
  if (name === 'memories') loadMemories();
  if (name === 'stats') loadStats();
}

// Memories list
async function loadMemories() {
  const ns = $('ns-filter').value;
  const params = new URLSearchParams({limit: MEMORIES_LIMIT, offset: memoriesOffset});
  if (ns) params.set('namespace', ns);
  $('memories-list').innerHTML = '<div class="loading">Loading...</div>';
  try {
    const data = await api('/memories?' + params.toString());
    currentMemories = data;
    renderMemories(data);
  } catch(e) {
    $('memories-list').innerHTML = '<div class="empty-state">Error: ' + e.message + '</div>';
  }
}

function renderMemories(data) {
  if (!data.length) {
    $('memories-list').innerHTML = '<div class="empty-state">No memories found</div>';
    $('memories-pagination').innerHTML = '';
    return;
  }
  let html = '<table><thead><tr><th>Text</th><th>Namespace</th><th>Created</th><th style="width:160px">Actions</th></tr></thead><tbody>';
  data.forEach(m => {
    html += `<tr>
      <td><div class="memory-text" title="${esc(m.text)}">${esc(m.text)}</div></td>
      <td><span class="badge ns">${esc(m.namespace)}</span></td>
      <td style="font-size:12px;color:#888">${formatTime(m.created_at)}</td>
      <td><div class="actions">
        <button class="btn btn-sm btn-outline" onclick="viewDetail('${m.id}')">View</button>
        <button class="btn btn-sm btn-outline" onclick="editMemory('${m.id}')">Edit</button>
        <button class="btn btn-sm btn-danger" onclick="deleteMemory('${m.id}')">Del</button>
      </div></td>
    </tr>`;
  });
  html += '</tbody></table>';
  $('memories-list').innerHTML = html;

  // Pagination
  const total = parseInt($('ns-filter').dataset.total || '0');
  const hasMore = data.length >= MEMORIES_LIMIT;
  $('memories-pagination').innerHTML = `
    <button class="btn btn-sm btn-outline" onclick="memoriesOffset=0;loadMemories()" ${memoriesOffset <= 0 ? 'disabled' : ''}>First</button>
    <button class="btn btn-sm btn-outline" onclick="memoriesOffset=Math.max(0,memoriesOffset-${MEMORIES_LIMIT});loadMemories()" ${memoriesOffset <= 0 ? 'disabled' : ''}>Prev</button>
    <span style="color:#888">offset ${memoriesOffset}</span>
    <button class="btn btn-sm btn-outline" onclick="memoriesOffset+=${MEMORIES_LIMIT};loadMemories()" ${hasMore ? '' : 'disabled'}>Next</button>
  `;
}

// View detail
async function viewDetail(id) {
  try {
    const m = await api('/memories/' + id);
    showDetail(m);
  } catch(e) {
    toast(e.message, 'error');
  }
}

function showDetail(m) {
  $('detail-title').textContent = 'Memory: ' + m.id.slice(0,8) + '…';
  const metaStr = JSON.stringify(m.metadata || {}, null, 2);
  $('detail-body').innerHTML = `
    <div class="detail-field"><div class="label">ID</div><div class="value">${m.id}</div></div>
    <div class="detail-field"><div class="label">Text</div><div class="value" style="white-space:pre-wrap">${esc(m.text)}</div></div>
    <div class="detail-field"><div class="label">Namespace</div><div class="value"><span class="badge ns">${esc(m.namespace)}</span></div></div>
    <div class="detail-field"><div class="label">Created</div><div class="value">${formatTime(m.created_at) || '-'}</div></div>
    <div class="detail-field"><div class="label">Updated</div><div class="value">${formatTime(m.updated_at) || '-'}</div></div>
    <div class="detail-field"><div class="label">Score</div><div class="value">${m.score != null ? m.score.toFixed(6) : '-'}</div></div>
    <div class="detail-field"><div class="label">Metadata</div><div class="metadata-view">${metaStr === '{}' ? '<span style="color:#999">(empty)</span>' : esc(metaStr)}</div></div>
    <div style="margin-top:16px;display:flex;gap:8px">
      <button class="btn btn-primary btn-sm" onclick="closeDetail();editMemory('${m.id}')">Edit</button>
      <button class="btn btn-danger btn-sm" onclick="closeDetail();deleteMemory('${m.id}')">Delete</button>
      <button class="btn btn-outline btn-sm" onclick="closeDetail()">Close</button>
    </div>
  `;
  $('detail-modal').style.display = 'flex';
}

function closeDetail(e) {
  if (e && e.target !== e.currentTarget) return;
  $('detail-modal').style.display = 'none';
}

// Edit
function editMemory(id) {
  api('/memories/' + id).then(m => {
    const newText = prompt('Edit text:', m.text);
    if (newText === null) return;
    const newMeta = prompt('Edit metadata (JSON):', JSON.stringify(m.metadata || {}, null, 2));
    if (newMeta === null) return;
    let metaObj;
    try { metaObj = JSON.parse(newMeta) } catch(e) { toast('Invalid JSON', 'error'); return }
    api('/memories/' + id, {
      method: 'PUT',
      body: JSON.stringify({text: newText, metadata: metaObj}),
    }).then(() => {
      toast('Memory updated');
      loadMemories();
    }).catch(e => toast(e.message, 'error'));
  }).catch(e => toast(e.message, 'error'));
}

// Delete
async function deleteMemory(id) {
  if (!confirm('Delete this memory?')) return;
  try {
    await api('/memories/' + id, {method: 'DELETE'});
    toast('Memory deleted');
    loadMemories();
  } catch(e) {
    toast(e.message, 'error');
  }
}

// Clear namespace
async function clearNamespace() {
  const ns = $('ns-filter').value;
  if (!ns) { toast('Select a namespace first', 'error'); return }
  if (!confirm('Delete ALL memories in namespace "' + ns + '"?')) return;
  try {
    const r = await api('/memories?namespace=' + encodeURIComponent(ns), {method: 'DELETE'});
    toast('Deleted ' + r.deleted + ' memories');
    loadMemories();
    loadStats();
  } catch(e) {
    toast(e.message, 'error');
  }
}

// Search
async function doSearch(e) {
  e.preventDefault();
  const q = $('search-query').value;
  const k = parseInt($('search-k').value) || 10;
  const threshold = parseFloat($('search-threshold').value) || 0;
  const ns = $('search-ns').value || undefined;
  $('search-results').innerHTML = '<div class="loading">Searching...</div>';
  try {
    const data = await api('/memories/search', {
      method: 'POST',
      body: JSON.stringify({query: q, k, threshold, namespace: ns}),
    });
    renderSearchResults(data);
  } catch(e) {
    $('search-results').innerHTML = '<div class="empty-state">Error: ' + e.message + '</div>';
  }
}

function renderSearchResults(data) {
  if (!data.length) {
    $('search-results').innerHTML = '<div class="empty-state">No results found</div>';
    return;
  }
  let html = '<table><thead><tr><th>Score</th><th>Text</th><th>Namespace</th><th style="width:100px">Actions</th></tr></thead><tbody>';
  data.forEach(m => {
    html += `<tr>
      <td><span class="badge">${(m.score * 100).toFixed(1)}%</span></td>
      <td><div class="memory-text" title="${esc(m.text)}">${esc(m.text)}</div></td>
      <td><span class="badge ns">${esc(m.namespace)}</span></td>
      <td><button class="btn btn-sm btn-outline" onclick="viewDetail('${m.id}')">View</button></td>
    </tr>`;
  });
  html += '</tbody></table>';
  $('search-results').innerHTML = html;
}

// Add
async function doAdd(e) {
  e.preventDefault();
  const text = $('add-text').value;
  let meta = {};
  try {
    const raw = $('add-metadata').value;
    if (raw.trim()) meta = JSON.parse(raw);
  } catch(e) { toast('Invalid metadata JSON', 'error'); return }
  const ns = $('add-ns').value || 'default';
  try {
    const r = await api('/memories', {
      method: 'POST',
      body: JSON.stringify({text, metadata: meta, namespace: ns}),
    });
    toast('Memory added: ' + r.id);
    $('add-text').value = '';
    $('add-metadata').value = '';
    loadStats();
  } catch(e) {
    toast(e.message, 'error');
  }
}

// Stats
async function loadStats() {
  $('stats-content').innerHTML = '<div class="loading">Loading...</div>';
  try {
    const s = await api('/stats');
    $('stats-content').innerHTML = `
      <div class="detail-field"><div class="label">Total Memories</div><div class="value" style="font-size:28px;font-weight:700">${s.total}</div></div>
      <div class="detail-field"><div class="label">Backend</div><div class="value">${s.backend}</div></div>
      <div class="detail-field"><div class="label">Storage Path</div><div class="value">${s.path}</div></div>
      <div class="detail-field"><div class="label">Embed Model</div><div class="value">${s.embed_model || '-'}</div></div>
      <div class="detail-field"><div class="label">Ollama URL</div><div class="value">${s.ollama_base_url || '-'}</div></div>
      <div class="detail-field"><div class="label">Namespaces</div><div class="value">${(s.namespaces || []).map(n => '<span class="badge ns" style="margin:2px">' + esc(n) + '</span>').join(' ') || '<span style="color:#999">(none)</span>'}</div></div>
      <div style="margin-top:16px">
        <button class="btn btn-sm btn-outline" onclick="loadStats()">Refresh</button>
      </div>
    `;
    // Update namespace filter
    allNamespaces = s.namespaces || [];
    updateNsFilter();
  } catch(e) {
    $('stats-content').innerHTML = '<div class="empty-state">Error: ' + e.message + '</div>';
  }
}

function updateNsFilter() {
  const sel = $('ns-filter');
  const current = sel.value;
  sel.innerHTML = '<option value="">All Namespaces</option>';
  allNamespaces.forEach(ns => {
    const opt = document.createElement('option');
    opt.value = ns;
    opt.textContent = ns + ' (' + countInNamespace(ns) + ')';
    if (ns === current) opt.selected = true;
    sel.appendChild(opt);
  });
  if (current && !allNamespaces.includes(current)) sel.value = '';
}

function countInNamespace(ns) {
  return currentMemories.filter(m => m.namespace === ns).length;
}

function refreshStats() {
  loadStats();
  loadMemories();
}

function esc(s) {
  if (s == null) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

// Init
loadMemories();
loadStats();
</script>
</body>
</html>
