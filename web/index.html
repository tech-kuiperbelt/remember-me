<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f5;color:#333;min-height:100vh}
.header{background:#4a90d9;color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:20px;font-weight:600}
.header .sub{font-size:13px;opacity:.85}
.nav{background:#fff;border-bottom:1px solid #e0e0e0;display:flex;padding:0 24px;position:sticky;top:0;z-index:10}
.nav a{padding:12px 18px;text-decoration:none;color:#555;font-size:14px;border-bottom:2px solid transparent;transition:.15s;cursor:pointer}
.nav a:hover{color:#4a90d9}
.nav a.active{color:#4a90d9;border-bottom-color:#4a90d9}
.content{padding:24px;max-width:1200px;margin:0 auto}
.page{display:none}
.page.active{display:block}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:16px;overflow:hidden}
.card-header{padding:14px 18px;border-bottom:1px solid #f0f0f0;font-weight:600;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.ns-tabs{padding:0 18px;border-bottom:1px solid #f0f0f0;display:flex;gap:4px;background:#fafafa;flex-wrap:wrap}
.ns-tab{padding:8px 16px;font-size:13px;cursor:pointer;color:#666;border-bottom:2px solid transparent;transition:.15s;user-select:none}
.ns-tab:hover{color:#4a90d9}
.ns-tab.active{color:#4a90d9;border-bottom-color:#4a90d9;font-weight:600}
.card-body{padding:18px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #f0f0f0}
th{background:#fafafa;font-weight:600;color:#555;font-size:12px;text-transform:uppercase;letter-spacing:.5px;-webkit-user-select:none;user-select:none}
th.sortable:hover{background:#f0f4ff;color:#4a90d9}
tr:hover{background:#f8fbff}
tr.selected{background:#e8f4fd}
.memory-text{max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;background:#e8f0fe;color:#4a90d9}
.badge.ns{background:#e8f5e9;color:#388e3c}
.btn{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border:none;border-radius:6px;font-size:13px;cursor:pointer;transition:.15s;text-decoration:none}
.btn-primary{background:#4a90d9;color:#fff}
.btn-primary:hover{background:#3a7bc8}
.btn-danger{background:#e53935;color:#fff}
.btn-danger:hover{background:#c62828}
.btn-outline{background:transparent;border:1px solid #ddd;color:#555}
.btn-outline:hover{background:#f5f5f5}
.btn-sm{padding:4px 10px;font-size:12px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:#555}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;outline:0;transition:.15s}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:#4a90d9;box-shadow:0 0 0 3px rgba(74,144,217,.15)}
.form-group textarea{min-height:80px;resize:vertical;font-family:inherit}
.form-row{display:flex;gap:12px}
.form-row .form-group{flex:1}
.pagination{display:flex;align-items:center;gap:8px;padding:12px 0;font-size:13px;justify-content:center}
.pagination button{min-width:32px}
.empty-state{text-align:center;padding:40px;color:#999;font-size:14px}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:8px;color:#fff;font-size:13px;z-index:999;animation:slideUp .3s;max-width:400px}
.toast.success{background:#43a047}
.toast.error{background:#e53935}
.toast.info{background:#4a90d9}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.loading{text-align:center;padding:30px;color:#999}
.detail-field{margin-bottom:12px}
.detail-field .label{font-size:12px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.detail-field .value{font-size:14px;word-break:break-all}
.ns-wrapper{position:relative;overflow:visible}
.ns-dropdown{position:absolute;top:100%;left:0;right:0;z-index:999;background:#fff;border:1px solid #ddd;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.12);max-height:160px;overflow-y:auto;display:none}
.ns-dropdown div{padding:8px 10px;font-size:13px;cursor:pointer;transition:.1s}
.ns-dropdown div:hover{background:#f0f4ff;color:#4a90d9}
.metadata-view{background:#f8f9fa;padding:10px;border-radius:6px;font-family:monospace;font-size:12px;white-space:pre-wrap;max-height:200px;overflow:auto}
pre.json{background:#f8f9fa;padding:12px;border-radius:6px;font-size:12px;overflow:auto;max-height:300px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.search-highlight{background:#fff3cd;padding:0 2px}
.debug-ids [id]{outline:1px dashed #e53935;position:relative}
.debug-ids [id]::before{content:attr(id);position:absolute;top:-1px;left:-1px;font-size:10px;background:#e53935;color:#fff;padding:1px 4px;border-radius:0 0 4px 0;z-index:999;font-family:monospace;line-height:1.2;white-space:nowrap}
@media(max-width:768px){.form-row{flex-direction:column}.content{padding:12px}.nav{overflow-x:auto}.nav a{white-space:nowrap}}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>Memory Admin</h1>
    <div class="sub" id="server-info">remember-me MCP Server</div>
  </div>
  <div>
    <button id="btn-refresh" class="btn btn-outline" style="color:#fff;border-color:rgba(255,255,255,.4)" onclick="refreshStats()">Refresh</button>
    <button id="btn-debug" class="btn btn-outline" style="color:#fff;border-color:rgba(255,255,255,.4);margin-left:8px" onclick="toggleDebug()">Debug</button>
  </div>
</div>

<div class="nav" id="nav">
  <a id="nav-memories" class="active" onclick="switchPage('memories')">Memories</a>
  <a id="nav-search" onclick="switchPage('search')">Search</a>
  <a id="nav-add" onclick="switchPage('add')">Add Memory</a>
  <a id="nav-stats" onclick="switchPage('stats')">Stats</a>
</div>

<div class="content">

<!-- Memories -->
<div class="page active" id="page-memories">
  <div class="card">
    <div class="card-header">
      <span id="memories-title">Memories</span>
      <button id="btn-clear-ns" class="btn btn-danger btn-sm" onclick="clearNamespace()">Clear</button>
    </div>
    <div class="ns-tabs" id="ns-tabs">
      <span class="ns-tab active" data-ns="" onclick="switchNamespace(this, '')">All Namespaces</span>
    </div>
    <div class="card-body" style="padding:0">
      <div id="memories-list"><div class="loading">Loading...</div></div>
      <div class="pagination" id="memories-pagination"></div>
    </div>
  </div>
</div>

<!-- Search -->
<div class="page" id="page-search">
  <div class="card">
    <div class="card-header">Semantic Search</div>
    <div class="card-body">
      <form id="form-search" onsubmit="doSearch(event)">
        <div class="form-group">
          <label>Query</label>
          <input id="search-query" placeholder="Enter search text..." required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Max results (k)</label>
            <input id="search-k" type="number" value="10" min="1" max="100">
          </div>
          <div class="form-group">
            <label>Threshold</label>
            <input id="search-threshold" type="number" value="0" min="0" max="1" step="0.05">
          </div>
          <div class="form-group">
            <label>Namespace</label>
            <input id="search-ns" placeholder="(all)">
          </div>
        </div>
        <button id="btn-search-submit" class="btn btn-primary" type="submit">Search</button>
      </form>
      <div id="search-results" style="margin-top:16px"></div>
    </div>
  </div>
</div>

<!-- Add -->
<div class="page" id="page-add">
  <div class="card">
    <div class="card-header">Add New Memory</div>
    <div class="card-body">
      <form id="form-add" onsubmit="doAdd(event)">
        <div class="form-group">
          <label>Text *</label>
          <textarea id="add-text" required></textarea>
        </div>
        <div class="form-group">
          <label>Metadata (JSON)</label>
          <textarea id="add-metadata" placeholder='e.g. {"source": "chat", "tags": ["important"]}'></textarea>
        </div>
        <div class="form-group">
          <label>Namespace</label>
          <input id="add-ns" value="default">
        </div>
        <button id="btn-add-submit" class="btn btn-primary" type="submit">Add Memory</button>
      </form>
    </div>
  </div>
</div>

<!-- Stats -->
<div class="page" id="page-stats">
  <div class="card">
    <div class="card-header">Storage Statistics</div>
    <div class="card-body" id="stats-content"><div class="loading">Loading...</div></div>
  </div>
</div>

<!-- Detail modal -->
<div id="detail-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center" onclick="closeDetail(event)">
  <div style="background:#fff;border-radius:12px;width:700px;max-width:95vw;height:90vh;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.2)" onclick="event.stopPropagation()">
    <div style="padding:18px 20px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center;flex-shrink:0">
      <strong id="detail-title" style="font-size:16px">Memory Detail</strong>
      <button id="btn-detail-close" class="btn btn-sm btn-outline" onclick="closeDetail()">✕</button>
    </div>
    <div style="padding:20px;overflow-y:auto;flex:1" id="detail-body"></div>
  </div>
</div>

</div>

<script>
// State
let memoriesOffset = 0;
const MEMORIES_LIMIT = 20;
let currentMemories = [];
let allNamespaces = [];
let currentNamespace = '';
let statsData = null;
let sortField = 'created_at';
let sortDir = 'desc';

// Helpers
function $(id) { return document.getElementById(id) }

function formatTime(isoStr) {
  if (!isoStr) return '';
  const d = new Date(isoStr);
  if (isNaN(d.getTime())) return isoStr;
  return d.toLocaleString();
}

function toast(msg, type='success') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function api(path, opts={}) {
  return fetch('/api' + path, {
    headers: {'Content-Type': 'application/json', ...opts.headers},
    ...opts,
  }).then(r => {
    if (!r.ok) return r.json().then(e => { throw new Error(e.detail || r.statusText) });
    return r.json();
  });
}

// Navigation
function switchPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav a').forEach(a => a.classList.remove('active'));
  $('page-' + name).classList.add('active');
  document.querySelector(`.nav a[onclick*="${name}"]`).classList.add('active');
  if (name === 'memories') loadMemories();
  if (name === 'stats') loadStats();
}

// Memories list
async function loadMemories() {
  const params = new URLSearchParams({limit: MEMORIES_LIMIT, offset: memoriesOffset});
  if (currentNamespace) params.set('namespace', currentNamespace);
  $('memories-list').innerHTML = '<div class="loading">Loading...</div>';
  try {
    const data = await api('/memories?' + params.toString());
    currentMemories = data;
    renderMemories(data);
    updateNsTabs();
  } catch(e) {
    $('memories-list').innerHTML = '<div class="empty-state">Error: ' + e.message + '</div>';
  }
}

function toggleSort(field) {
  if (sortField === field) {
    sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    sortField = field;
    sortDir = 'asc';
  }
  renderMemories(currentMemories);
}

function sortMemories(data) {
  if (!sortField) return data;
  const sorted = [...data];
  sorted.sort((a, b) => {
    let va = a[sortField] || '';
    let vb = b[sortField] || '';
    if (typeof va === 'string') va = va.toLowerCase();
    if (typeof vb === 'string') vb = vb.toLowerCase();
    if (va < vb) return sortDir === 'asc' ? -1 : 1;
    if (va > vb) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });
  return sorted;
}

function sortArrow(field) {
  if (sortField !== field) return ' ↕';
  return sortDir === 'asc' ? ' ↑' : ' ↓';
}

function renderMemories(data) {
  if (!data.length) {
    $('memories-list').innerHTML = '<div class="empty-state">No memories found</div>';
    $('memories-pagination').innerHTML = '';
    return;
  }
  const sorted = sortMemories(data);
  let html = '<table id="memories-table"><thead><tr>' +
    `<th class="sortable" onclick="toggleSort('text')">Text${sortArrow('text')}</th>` +
    `<th class="sortable" onclick="toggleSort('namespace')">Namespace${sortArrow('namespace')}</th>` +
    `<th class="sortable" onclick="toggleSort('created_at')">Created${sortArrow('created_at')}</th>` +
    '<th style="width:160px">Actions</th></tr></thead><tbody>';
  sorted.forEach(m => {
    html += `<tr>
      <td><div class="memory-text" title="${esc(m.text)}">${esc(m.text)}</div></td>
      <td><span class="badge ns">${esc(m.namespace)}</span></td>
      <td style="font-size:12px;color:#888">${formatTime(m.created_at)}</td>
      <td><div class="actions">
        <button class="btn btn-sm btn-outline" onclick="viewDetail('${m.id}')">View</button>
        <button class="btn btn-sm btn-outline" onclick="editMemory('${m.id}')">Edit</button>
        <button class="btn btn-sm btn-danger" onclick="deleteMemory('${m.id}')">Del</button>
      </div></td>
    </tr>`;
  });
  html += '</tbody></table>';
  $('memories-list').innerHTML = html;

  // Pagination
  const hasMore = data.length >= MEMORIES_LIMIT;
  $('memories-pagination').innerHTML = `
    <button class="btn btn-sm btn-outline" onclick="memoriesOffset=0;loadMemories()" ${memoriesOffset <= 0 ? 'disabled' : ''}>First</button>
    <button class="btn btn-sm btn-outline" onclick="memoriesOffset=Math.max(0,memoriesOffset-${MEMORIES_LIMIT});loadMemories()" ${memoriesOffset <= 0 ? 'disabled' : ''}>Prev</button>
    <span style="color:#888">offset ${memoriesOffset}</span>
    <button class="btn btn-sm btn-outline" onclick="memoriesOffset+=${MEMORIES_LIMIT};loadMemories()" ${hasMore ? '' : 'disabled'}>Next</button>
  `;
}

// View detail
async function viewDetail(id) {
  try {
    const m = await api('/memories/' + id);
    showDetail(m, false);
  } catch(e) {
    toast(e.message, 'error');
  }
}

async function editMemory(id) {
  try {
    const m = await api('/memories/' + id);
    showDetail(m, true);
  } catch(e) {
    toast(e.message, 'error');
  }
}

function showDetail(m, editable) {
  $('detail-title').textContent = 'Memory: ' + m.id.slice(0,8) + '…';
  const metaStr = JSON.stringify(m.metadata || {}, null, 2);

  const textHtml = editable
    ? `<div style="flex:1;display:flex;flex-direction:column"><textarea id="edit-text" style="flex:1;min-height:0;width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;font-family:inherit;resize:none">${esc(m.text)}</textarea></div>`
    : `<div class="value" style="white-space:pre-wrap">${esc(m.text)}</div>`;

  const nsHtml = editable
    ? `<div class="ns-wrapper"><input id="edit-namespace" value="${esc(m.namespace)}" autocomplete="off" style="padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;width:100%" onfocus="showNsDropdown()" onblur="setTimeout(function(){hideNsDropdown()},150)"><div id="ns-dropdown" class="ns-dropdown">${allNamespaces.map(ns => `<div onmousedown="pickNs('${esc(ns)}')">${esc(ns)}</div>`).join('')}</div></div>`
    : `<span class="badge ns">${esc(m.namespace)}</span>`;

  const textFieldStyle = editable ? ' style="flex:1;display:flex;flex-direction:column;min-height:0"' : '';

  const safeId = esc(m.id);
  const actionsHtml = editable
    ? `<button class="btn btn-primary btn-sm" onclick="saveEdit('${safeId}')">Save</button><button class="btn btn-outline btn-sm" onclick="closeDetail()">Cancel</button>`
    : `<button class="btn btn-primary btn-sm" onclick="closeDetail();editMemory('${safeId}')">Edit</button><button class="btn btn-danger btn-sm" onclick="closeDetail();deleteMemory('${safeId}')">Delete</button><button class="btn btn-outline btn-sm" onclick="closeDetail()">Close</button>`;

  $('detail-body').setAttribute('style', 'padding:20px;overflow-y:auto;flex:1' + (editable ? ';display:flex;flex-direction:column' : ''));
  $('detail-body').innerHTML = `
    <div class="detail-field"><div class="label">ID</div><div class="value">${m.id}</div></div>
    <div class="detail-field"${textFieldStyle}><div class="label">Text</div>${textHtml}</div>
    <div class="detail-field"><div class="label">Namespace</div><div class="value">${nsHtml}</div></div>
    <div class="detail-field"><div class="label">Created</div><div class="value">${formatTime(m.created_at) || '-'}</div></div>
    <div class="detail-field"><div class="label">Updated</div><div class="value">${formatTime(m.updated_at) || '-'}</div></div>
    <div class="detail-field"><div class="label">Score</div><div class="value">${m.score != null ? m.score.toFixed(6) : '-'}</div></div>
    <div class="detail-field"><div class="label">Metadata</div><div class="metadata-view">${metaStr === '{}' ? '<span style="color:#999">(empty)</span>' : esc(metaStr)}</div></div>
    <div style="margin-top:16px;display:flex;gap:8px;flex-shrink:0">${actionsHtml}</div>
  `;
  $('detail-modal').style.display = 'flex';
}

async function saveEdit(id) {
  const textEl = $('edit-text');
  const nsEl = $('edit-namespace');
  if (!textEl || !nsEl) { toast('Form not ready, reopen the edit dialog', 'error'); return }
  const text = textEl.value;
  const namespace = nsEl.value;
  try {
    const res = await api('/memories/' + id, {
      method: 'PUT',
      body: JSON.stringify({text, namespace}),
    });
    toast('Memory updated');
    closeDetail();
    loadMemories();
    loadStats();
  } catch(e) {
    toast(e.message, 'error');
  }
}

function closeDetail(e) {
  if (e && e.target !== e.currentTarget) return;
  $('detail-modal').style.display = 'none';
}

// Delete
async function deleteMemory(id) {
  if (!confirm('Delete this memory?')) return;
  try {
    await api('/memories/' + id, {method: 'DELETE'});
    toast('Memory deleted');
    loadMemories();
  } catch(e) {
    toast(e.message, 'error');
  }
}

// Clear namespace
async function clearNamespace() {
  const ns = currentNamespace;
  if (!ns) { toast('Select a namespace first', 'error'); return }
  if (!confirm('Delete ALL memories in namespace "' + ns + '"?')) return;
  try {
    const r = await api('/memories?namespace=' + encodeURIComponent(ns), {method: 'DELETE'});
    toast('Deleted ' + r.deleted + ' memories');
    loadMemories();
    loadStats();
  } catch(e) {
    toast(e.message, 'error');
  }
}

// Search
async function doSearch(e) {
  e.preventDefault();
  const q = $('search-query').value;
  const k = parseInt($('search-k').value) || 10;
  const threshold = parseFloat($('search-threshold').value) || 0;
  const ns = $('search-ns').value || undefined;
  $('search-results').innerHTML = '<div class="loading">Searching...</div>';
  try {
    const data = await api('/memories/search', {
      method: 'POST',
      body: JSON.stringify({query: q, k, threshold, namespace: ns}),
    });
    renderSearchResults(data);
  } catch(e) {
    $('search-results').innerHTML = '<div class="empty-state">Error: ' + e.message + '</div>';
  }
}

function renderSearchResults(data) {
  if (!data.length) {
    $('search-results').innerHTML = '<div class="empty-state">No results found</div>';
    return;
  }
  let html = '<table><thead><tr><th>Score</th><th>Text</th><th>Namespace</th><th style="width:100px">Actions</th></tr></thead><tbody>';
  data.forEach(m => {
    html += `<tr>
      <td><span class="badge">${(m.score * 100).toFixed(1)}%</span></td>
      <td><div class="memory-text" title="${esc(m.text)}">${esc(m.text)}</div></td>
      <td><span class="badge ns">${esc(m.namespace)}</span></td>
      <td><button class="btn btn-sm btn-outline" onclick="viewDetail('${m.id}')">View</button></td>
    </tr>`;
  });
  html += '</tbody></table>';
  $('search-results').innerHTML = html;
}

// Add
async function doAdd(e) {
  e.preventDefault();
  const text = $('add-text').value;
  let meta = {};
  try {
    const raw = $('add-metadata').value;
    if (raw.trim()) meta = JSON.parse(raw);
  } catch(e) { toast('Invalid metadata JSON', 'error'); return }
  const ns = $('add-ns').value || 'default';
  try {
    const r = await api('/memories', {
      method: 'POST',
      body: JSON.stringify({text, metadata: meta, namespace: ns}),
    });
    toast('Memory added: ' + r.id);
    $('add-text').value = '';
    $('add-metadata').value = '';
    loadStats();
  } catch(e) {
    toast(e.message, 'error');
  }
}

// Stats
async function loadStats() {
  $('stats-content').innerHTML = '<div class="loading">Loading...</div>';
  try {
    const s = await api('/stats');
    $('stats-content').innerHTML = `
      <div class="detail-field"><div class="label">Total Memories</div><div class="value" style="font-size:28px;font-weight:700">${s.total}</div></div>
      <div class="detail-field"><div class="label">Backend</div><div class="value">${s.backend}</div></div>
      <div class="detail-field"><div class="label">Storage Path</div><div class="value">${s.path}</div></div>
      <div class="detail-field"><div class="label">Embed Model</div><div class="value">${s.embed_model || '-'}</div></div>
      <div class="detail-field"><div class="label">Ollama URL</div><div class="value">${s.ollama_base_url || '-'}</div></div>
      <div class="detail-field"><div class="label">Namespaces</div><div class="value">${(s.namespaces || []).map(n => '<span class="badge ns" style="margin:2px">' + esc(n) + '</span>').join(' ') || '<span style="color:#999">(none)</span>'}</div></div>
      <div style="margin-top:16px">
        <button id="btn-stats-refresh" class="btn btn-sm btn-outline" onclick="loadStats()">Refresh</button>
      </div>
    `;
    // Update namespace tabs
    statsData = s;
    allNamespaces = s.namespaces || [];
    updateNsTabs();
  } catch(e) {
    $('stats-content').innerHTML = '<div class="empty-state">Error: ' + e.message + '</div>';
  }
}

function switchNamespace(el, ns) {
  currentNamespace = ns;
  document.querySelectorAll('#ns-tabs .ns-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  memoriesOffset = 0;
  loadMemories();
}

function updateNsTabs() {
  const container = $('ns-tabs');
  const current = currentNamespace;
  const counts = (statsData && statsData.namespace_counts) || {};
  let html = `<span class="ns-tab${current === '' ? ' active' : ''}" data-ns="" onclick="switchNamespace(this, '')">All Memories</span>`;
  allNamespaces.forEach(ns => {
    const count = counts[ns] != null ? counts[ns] : currentMemories.filter(m => m.namespace === ns).length;
    html += `<span class="ns-tab${ns === current ? ' active' : ''}" data-ns="${esc(ns)}" onclick="switchNamespace(this, '${esc(ns)}')">${esc(ns)} (${count})</span>`;
  });
  container.innerHTML = html;
}

function toggleDebug() {
  document.body.classList.toggle('debug-ids');
  const btn = $('btn-debug');
  btn.textContent = document.body.classList.contains('debug-ids') ? 'Debug ON' : 'Debug';
}

function showNsDropdown() {
  const dd = $('ns-dropdown');
  if (dd) dd.style.display = 'block';
}

function hideNsDropdown() {
  const dd = $('ns-dropdown');
  if (dd) dd.style.display = 'none';
}

function pickNs(ns) {
  $('edit-namespace').value = ns;
  hideNsDropdown();
}

function refreshStats() {
  loadStats();
  loadMemories();
}

function esc(s) {
  if (s == null) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

// Init
loadMemories();
loadStats();
</script>
</body>
</html>
