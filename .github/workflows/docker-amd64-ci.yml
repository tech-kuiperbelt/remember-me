name: archive-transfer
run-name: Archive transfer ${{ inputs.mode }} (frozen 8ff9224)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Transfer existing frozen bytes only; never build or publish
        type: choice
        options: [native, linux]
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: remember-me-archive-transfer
  cancel-in-progress: false
jobs:
  transfer:
    if: github.repository == 'tech-kuiperbelt/remember-me' && github.ref == 'refs/heads/ops/v1.1.3-archive-transfer'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MODE: ${{ inputs.mode }}
    steps:
      - name: Transfer and independently verify frozen candidate bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTRANSFER'
          import concurrent.futures
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import shutil
          import stat
          import subprocess
          import zipfile

          REPO = 'tech-kuiperbelt/remember-me'
          SOURCE = '8ff922409b7a2a9670577adcfe9687da7e975b9f'
          TAG = 'v1.1.3'
          WORK = Path(os.environ['RUNNER_TEMP']) / 'archive-transfer'
          WORK.mkdir(exist_ok=True)
          RESULT = {'source_commit': SOURCE, 'mode': os.environ['MODE'], 'assets': [], 'artifacts': []}
          HEX = re.compile(r'[0-9a-f]{64}\Z')
          INSTALLERS = {
              'windows': ('remember-me-windows-x64-beta-setup.exe', 1510272020,
                          'bf5b247f6f6aaf48cf86792079faeb9df35add940107dfdc6bf95d4df36b77a4'),
              'macos': ('remember-me-macos-arm64-beta.dmg', 1884000499,
                        'f9daafbde4b6402423c1ad3b6f1463efbc1e1c025bfb2fac0e67b87720782c28'),
              'linux': ('remember-me-1.1.3-linux-x86_64.AppImage', 1685584376,
                        '847744026dd873576f0173c979d43d24441a36925bf1cf4b5503f7189e1d6577'),
          }


          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)


          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True)


          def api(path):
              return json.loads(gh('api', path))


          def pages(path):
              for page in range(1, 101):
                  rows = api(f'{path}?per_page=100&page={page}')
                  require(isinstance(rows, list), 'Invalid API listing')
                  yield from rows
                  if len(rows) < 100:
                      return
              raise RuntimeError('Pagination limit exceeded')


          def draft():
              rows = [r for r in pages(f'repos/{REPO}/releases') if r['tag_name'] == TAG]
              require(len(rows) == 1, 'Expected one v1.1.3 Draft')
              data = api(f'repos/{REPO}/releases/{rows[0]["id"]}')
              require(data['draft'] is True and data['prerelease'] is True
                      and data['target_commitish'] == SOURCE and data['tag_name'] == TAG,
                      'Refuse to write assets outside the frozen nonpublic Draft')
              return data


          def remote_assets():
              data = draft()
              rows = list(pages(f'repos/{REPO}/releases/{data["id"]}/assets'))
              require(len({r['name'] for r in rows}) == len(rows), 'Duplicate remote asset names')
              return {r['name']: r for r in rows}


          def sha(path):
              result = hashlib.sha256()
              with path.open('rb') as stream:
                  for block in iter(lambda: stream.read(8 * 1024 * 1024), b''):
                      result.update(block)
              return result.hexdigest()


          def verify(path, size, digest):
              require(path.is_file() and not path.is_symlink(), f'Not a regular file: {path.name}')
              require(path.stat().st_size == size and sha(path) == digest, f'Byte verification failed: {path.name}')


          def matching(record, size, digest):
              require(record['state'] == 'uploaded' and record['size'] == size
                      and record.get('digest') == 'sha256:' + digest,
                      f'Conflicting/incomplete asset, never clobber: {record["name"]}')


          def upload(path):
              size, digest = path.stat().st_size, sha(path)
              assets = remote_assets()
              if path.name in assets:
                  matching(assets[path.name], size, digest)
                  state = 'identical-existing'
              else:
                  # gh resolves the authenticated pending Draft tag; no Tag is created.
                  subprocess.run(['gh', 'release', 'upload', TAG, str(path), '--repo', REPO], check=True)
                  matching(remote_assets()[path.name], size, digest)
                  state = 'uploaded'
              RESULT['assets'].append({'name': path.name, 'size': size, 'sha256': digest, 'state': state})
              print(json.dumps(RESULT['assets'][-1]), flush=True)


          def read_json(path):
              return json.loads(path.read_text(encoding='utf-8-sig'))


          def artifact(identifier, label):
              metadata = api(f'repos/{REPO}/actions/artifacts/{identifier}')
              require(metadata['id'] == identifier and metadata['expired'] is False, 'Artifact missing/expired')
              run = api(f'repos/{REPO}/actions/runs/{metadata["workflow_run"]["id"]}')
              require(run['head_sha'] == SOURCE and run['conclusion'] == 'success'
                      and run['status'] == 'completed' and run['repository']['full_name'] == REPO,
                      'Artifact was not built by a successful frozen-source run')
              require(metadata['workflow_run']['head_sha'] == SOURCE, 'Artifact source differs')
              archive = WORK / f'{label}.zip'
              with archive.open('wb') as out:
                  subprocess.run(['gh', 'api', f'repos/{REPO}/actions/artifacts/{identifier}/zip'], stdout=out, check=True)
              digest = sha(archive)
              if metadata.get('digest'):
                  require(metadata['digest'] == 'sha256:' + digest, 'Artifact ZIP digest differs')
              output = WORK / label
              output.mkdir()
              with zipfile.ZipFile(archive) as bundle:
                  names = set()
                  for member in bundle.infolist():
                      path = PurePosixPath(member.filename)
                      require(not path.is_absolute() and '..' not in path.parts and '\\' not in member.filename,
                              'Unsafe ZIP path')
                      require(not stat.S_ISLNK(member.external_attr >> 16), 'Symlinks are not allowed in transfer archives')
                      require(member.filename not in names, 'Duplicate ZIP member')
                      names.add(member.filename)
                  bundle.extractall(output)
              RESULT['artifacts'].append({'id': identifier, 'ci_run': run['html_url'], 'head_sha': run['head_sha'],
                                          'zip_sha256': digest, 'zip_size': archive.stat().st_size})
              archive.unlink()
              return output


          def installer(folder, platform):
              name, size, digest = INSTALLERS[platform]
              verify(folder / name, size, digest)
              sidecar = folder / (name + '.sha256')
              fields = sidecar.read_text(encoding='utf-8-sig').split()
              require(len(fields) == 2 and fields[0] == digest and fields[1].lstrip('*') == name,
                      'Installer checksum sidecar differs')
              upload(folder / name)
              upload(sidecar)


          def native():
              windows = artifact(13838221225, 'windows')
              installer(windows, 'windows')
              evidence = read_json(windows / 'setup-build-evidence.json')
              name, size, digest = INSTALLERS['windows']
              require(evidence['app_version'] == '1.1.3' and evidence['setup']['name'] == name
                      and evidence['setup']['size'] == size and evidence['setup']['sha256'] == digest,
                      'Windows build evidence differs')
              upload(windows / 'setup-build-evidence.json')
              macos = artifact(13838415450, 'macos')
              installer(macos, 'macos')
              docker = artifact(13837649016, 'docker') / 'frozen-image'
              frozen = read_json(docker / 'frozen-image.json')
              require(frozen['source_commit'] == SOURCE and frozen['version'] == '1.1.3'
                      and frozen['release_sha256'] == 'da00ed055dfe446a27d2943d86cd6a03a260d63ae7f061debb0ecb67a0aed11f'
                      and frozen['image_id'] == 'sha256:fed192c9f87038af6324a618e0efff0a8171c1fe4de652b7f1fb8491e745608f',
                      'Docker frozen identity differs')
              parts = frozen['archive']['parts']
              require([p['name'] for p in parts] == ['docker-amd64.tar.gz.part000', 'docker-amd64.tar.gz.part001'],
                      'Unexpected Docker part names/order')
              aggregate = hashlib.sha256()
              total = 0
              for part in parts:
                  path = docker / part['name']
                  verify(path, part['bytes'], part['sha256'])
                  with path.open('rb') as stream:
                      for block in iter(lambda: stream.read(8 * 1024 * 1024), b''):
                          aggregate.update(block)
                          total += len(block)
              require(total == frozen['archive']['bytes'] and aggregate.hexdigest() == frozen['archive']['sha256'],
                      'Complete Docker archive differs')
              for part in parts:
                  upload(docker / part['name'])
              upload(docker / 'frozen-image.json')


          def linux():
              output = WORK / 'linux'
              output.mkdir()
              subprocess.run(['gh', 'release', 'download', TAG, '--repo', REPO,
                              '--pattern', 'linux-transfer.json', '--dir', str(output)], check=True)
              index = read_json(output / 'linux-transfer.json')
              name, size, digest = INSTALLERS['linux']
              require(index['source_commit'] == SOURCE and (index['name'], index['size'], index['sha256']) == (name, size, digest),
                      'Linux transfer index differs from frozen installer')
              records = index['parts']
              require(len(records) == 51 and [p['name'] for p in records] == [f'linux-transfer-part-{i:03d}' for i in range(51)],
                      'Unexpected Linux transfer part set/order')
              assets = remote_assets()
              for i, record in enumerate(records):
                  require(record['size'] == min(32 * 1024**2, size - i * 32 * 1024**2)
                          and HEX.fullmatch(record['sha256']) is not None, 'Invalid transfer part size/hash')
                  matching(assets[record['name']], record['size'], record['sha256'])

              def fetch(record):
                  subprocess.run(['gh', 'release', 'download', TAG, '--repo', REPO, '--pattern', record['name'],
                                  '--dir', str(output)], check=True)
                  verify(output / record['name'], record['size'], record['sha256'])

              with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
                  list(pool.map(fetch, records))
              with (output / name).open('wb') as joined:
                  for record in records:
                      with (output / record['name']).open('rb') as part:
                          shutil.copyfileobj(part, joined, 8 * 1024 * 1024)
              verify(output / name, size, digest)
              sidecar = output / (name + '.sha256')
              sidecar.write_text(f'{digest}  {name}\n')
              upload(output / name)
              upload(sidecar)


          require(os.environ.get('GITHUB_REPOSITORY') == REPO, 'Wrong repository')
          require(os.environ.get('GITHUB_REF') == 'refs/heads/ops/v1.1.3-archive-transfer', 'Wrong control branch')
          draft()
          if os.environ['MODE'] == 'native':
              native()
          elif os.environ['MODE'] == 'linux':
              linux()
          else:
              raise RuntimeError('Unknown transfer mode')
          draft()
          Path('archive-transfer-result.json').write_text(json.dumps(RESULT, indent=2) + '\n')
          print('Transfer verified; frozen source, official Tag and public Release remain untouched.', flush=True)
          PYTRANSFER
      - name: Retain transfer evidence
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: archive-transfer-${{ inputs.mode }}-${{ github.run_id }}
          path: archive-transfer-result.json
          retention-days: 90
          if-no-files-found: error
