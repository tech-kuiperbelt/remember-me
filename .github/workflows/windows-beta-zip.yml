name: windows-beta-zip
on:
  push:
    branches: [poc/windows-beta-zip]
permissions:
  contents: read
concurrency:
  group: windows-beta-zip
  cancel-in-progress: false
jobs:
  candidate:
    if: github.repository == 'tech-kuiperbelt/remember-me' && github.ref == 'refs/heads/poc/windows-beta-zip'
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record disk and parse build scripts before downloads
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'remember-me-beta-preflight'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          Get-PSDrive -PSProvider FileSystem | Format-List * | Out-File "$evidence/disk.txt"
          foreach ($name in @('packaging/windows-beta/build.ps1', 'packaging/windows-poc/build.ps1')) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $name), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - name: Build and business smoke, then ZIP
        timeout-minutes: 50
        run: |
          ./packaging/windows-beta/build.ps1 -Work (Join-Path $env:RUNNER_TEMP 'remember-me-beta') -Storage dual
      - name: Upload Beta candidate ZIP and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-beta-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/remember-me-beta/remember-me-windows-x64-beta-candidate.zip
            ${{ runner.temp }}/remember-me-beta/remember-me-windows-x64-beta-candidate.zip.sha256
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-beta-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/remember-me-beta/evidence/
            ${{ runner.temp }}/remember-me-beta-preflight/
          retention-days: 14
          if-no-files-found: warn
